name: golang build

on: [push, pull_request, workflow_dispatch]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pinned toolchain
      uses: jdx/mise-action@v2

    - name: Build
      run: go build -v ./...

    - name: Lint
      run: golangci-lint run

    - name: Test (with covdata)
      run: |
        rm -rf .coverdata
        mkdir -p .coverdata/unit .coverdata/e2e .coverdata/merged
        SPR_E2E_COVERDIR=$GITHUB_WORKSPACE/.coverdata/e2e \
          go test -race -covermode=atomic ./... -args -test.gocoverdir=$GITHUB_WORKSPACE/.coverdata/unit
        # The e2e harness writes covdata into unique run-* subdirs of
        # .coverdata/e2e; covdata is not recursive, so enumerate the leaf dirs.
        # Join unit + e2e dirs with echo+tr (collapses the trailing newline) so
        # there is no trailing comma, which covdata would read as an empty "" dir.
        COV_DIRS=$(echo $GITHUB_WORKSPACE/.coverdata/unit $(find $GITHUB_WORKSPACE/.coverdata/e2e -name 'covmeta.*' -exec dirname {} \; | sort -u) | tr ' ' ',')
        go tool covdata merge -i=$COV_DIRS -o=$GITHUB_WORKSPACE/.coverdata/merged
        go tool covdata textfmt -i=$GITHUB_WORKSPACE/.coverdata/merged -o=coverage.txt

    - name: Coverage gate
      run: go-test-coverage --config=.testcoverage.yml

    - name: Check goreleaser file
      run: goreleaser check
