profile: coverage.txt
threshold:
  total: 90     # Phase 3 final floor (measured 90.1% over the covdata denominator,
                # which includes the cmd/spr + cmd/amend binaries exercised by the
                # internal/e2e scenarios). Numbers only go up from here.
  file: 70      # real per-file anti-rot floor. Every measured file is >=70% except
                # the override below (cmd/spr/main.go, network-bound CLI wiring).
# Per-file overrides for files whose remainder is a recorded deferred gap
# (see docs/superpowers/specs/2026-06-27-phase2-known-failures.md). Not an
# exclusion — the file is still measured, just held to its honest current floor.
override:
  - threshold: 45   # cmd/spr/main.go: measured 50.0%. The e2e scenarios cover the
                    # whole cli.App{} wiring, handleEditSequence, and the NewGitCmd/
                    # ParseConfig/NewGitHubClient os.Exit guards; the residual is the
                    # subcommand Action func bodies that call GitHub (network-only) —
                    # DG-CMDSPR-1. The delegate logic they call is ~99% covered in
                    # package spr.
    path: cmd/spr/main\.go$
exclude:
  paths:
    - github/githubclient/gen/genclient
    - github/githubclient/fezzik_types
    - internal/e2e
